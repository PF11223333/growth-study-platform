name: Publish reading edition
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Validated site bundle release
        required: true
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: growth-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download validated site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release download "$RELEASE_TAG" --pattern site.zip --dir bundle
          unzip -q bundle/site.zip -d site
          test -f site/version.json
          test -f site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
